name: Arena Forge v287 denge
on:
  push:
    branches: [denge/v287]
    paths: ['denge-v287/**', '.github/workflows/denge-v287.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oyunu derle
        run: sh denge-v287/build.sh
      - name: Tarayıcı testleri
        run: |
          python -m pip install playwright
          cp minyon-yetenekleri/arac/tests/harness.py denge-v287/harness.py
          cp minyon-yetenekleri/arac/src/af285_qa.js denge-v287/qa.js
          python denge-v287/test.py
      - name: Test edilen oyunu ve ZIP dosyasını kaydet
        working-directory: denge-v287
        run: |
          zip -9 ArenaForgePro_v287.zip ArenaForgePro_v287.html qa-*.json
          git add ArenaForgePro_v287.html ArenaForgePro_v287.zip qa-*.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Test edilen v287 HTML ve ZIP"
          git push origin HEAD:refs/heads/denge/v287
