name: v263 VFX readability test APK
on:
  push:
    branches: [test/v263-vfx-readability]
    paths: [.github/workflows/v263-vfx-readability.yml]
  workflow_dispatch:
jobs:
  test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply isolated VFX readability patch to Android game's bundled HTML
        run: |
          python3 onarim/araclar/v263_vfx_readability_test.py
          cp onarim/cikti_v263/ArenaForgePro_v3.60.263_EFEKT_DENGE_TEST.html app/src/main/assets/www/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          assert 'ctx.globalAlpha=fade*.46*taper;' in s
          assert 'ctx.shadowBlur=0;' in s
          assert 'powerPreference:\'high-performance\'' not in s
          assert 'gl.scissor(0,glY,cw,bh)' not in s
          print('Verified original v263 without rejected GPU patch',len(s))
          PY
      - name: Build Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify packaged VFX patch
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          p='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as z:
            s=z.read('assets/www/index.html').decode()
            assert 'ctx.globalAlpha=fade*.46*taper;' in s
            assert 'if(ta>.02&&units.length<14)' in s
            assert 'gl.scissor(0,glY,cw,bh)' not in s
          print('PASS: 5 changes packaged in APK, rejected GPU change absent')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaForgePro-v263-VFX-Readability-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
