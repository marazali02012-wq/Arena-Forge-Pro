name: GPU optimize v263 test APK
on:
  push:
    branches: [fix/gpu-canvas-resize-v263]
    paths: [.github/workflows/gpu-v263-test.yml]
  workflow_dispatch:
jobs:
  gpu-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply GPU patch to Android game's actual index.html
        run: |
          python3 onarim/araclar/gpu_canvas_resize_v263.py
          cp onarim/cikti_v263/ArenaForgePro_v3.60.263_GPU_OPTIMIZE_TEST.html app/src/main/assets/www/index.html
          python3 - <<'PY'
          from pathlib import Path
          a=Path("app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          assert "diag.scissoredFrames++" in a and "powerPreference:'high-performance'" in a
          print("GPU patched HTML bytes",len(a.encode()))
          PY
      - name: Build signed debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK contains GPU patch and signature
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          p="app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(p) as z:
            s=z.read("assets/www/index.html").decode()
            assert "diag.scissoredFrames++" in s
            assert "powerPreference:'high-performance'" in s
          print("PASS: GPU patch embedded in actual Android APK")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaForgePro-v263-GPU-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
