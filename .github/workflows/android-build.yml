name: Arena Forge Pro Android

on:
  workflow_dispatch:
  push:
    branches: ['repair/v309']
    paths:
      - 'app/**'
      - 'onarim-v309/**'
      - 'gradle/**'
      - 'tools/**'
      - 'test/**'
      - 'sunucu/**'
      - 'version.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'marazali02012-wq/Arena-Forge-Pro' && github.ref == 'refs/heads/repair/v309'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: v309 oyun HTML dosyasını hazırla
        run: |
          if ! python3 tools/set-version.py 309 --check; then
            python3 tools/recovery/restore-html.py
            python3 onarim-v309/patch-html.py
            python3 tools/set-version.py 309
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sürümü ve sunucu sürüm denetimini test et
        run: |
          python3 tools/set-version.py "$(cut -d= -f2 version.properties)" --check
          node --test test/client-version-gate.test.cjs
      - name: Android SDK ve derleme
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            mkdir -p "$sdk/cmdline-tools"
            curl --fail --silent --show-error --location -o "$RUNNER_TEMP/android-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            export PATH="$sdk/cmdline-tools/latest/bin:$PATH"
          fi
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          bash gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Çıktıları doğrula
        run: |
          mkdir artifacts
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/bundletool.jar"             https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          version="$(cut -d= -f2 version.properties)"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/ArenaForgePro_v${version}_IMZASIZ.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/ArenaForgePro_v${version}_TEST.apk"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="artifacts/ArenaForgePro_v${version}_IMZASIZ.aab" | tee artifacts/bundletool.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "artifacts/ArenaForgePro_v${version}_TEST.apk" | tee artifacts/apksigner.txt
      - name: Mevcut Play yükleme sertifikası doğrulanırsa AAB’yi imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$UPLOAD_KEYSTORE_PASSWORD" || -z "$UPLOAD_KEY_ALIAS" || -z "$PLAY_UPLOAD_CERT_SHA256" ]]; then
            echo 'Mevcut yükleme anahtarı veya Play Console sertifika değeri yapılandırılmamış.'
            exit 0
          fi
          umask 077
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks"
          trap 'rm -f "$UPLOAD_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_PATH"
          version="$(cut -d= -f2 version.properties)"
          bash tools/sign-aab.sh "artifacts/ArenaForgePro_v${version}_IMZASIZ.aab" "artifacts/ArenaForgePro_v${version}_PLAY_IMZALI.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="artifacts/ArenaForgePro_v${version}_PLAY_IMZALI.aab"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ArenaForgePro-android
          path: artifacts/
          if-no-files-found: ignore
  android-smoke:
    needs: build
    timeout-minutes: 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ArenaForgePro-android
          path: artifacts
      - name: KVM erişimini aç
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 420
          script: bash test/android-smoke-v309.sh artifacts/ArenaForgePro_v309_TEST.apk
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ArenaForgePro-v309-native-smoke
          path: native-results/
          if-no-files-found: ignore
