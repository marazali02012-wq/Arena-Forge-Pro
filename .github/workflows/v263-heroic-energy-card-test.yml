name: v263 Heroic energy badge TEST APK
on:
  push:
    branches: [test/v263-heroic-energy-hand]
    paths: [.github/workflows/v263-heroic-energy-card-test.yml]
  workflow_dispatch:
jobs:
  android-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install asset processor
        run: python3 -m pip install pillow
      - name: Generate fully playable HTML with prior fixes
        run: |
          python3 onarim/araclar/v263_vfx_readability_test.py
          python3 onarim/araclar/v263_hp_dual_color_test.py
          python3 onarim/araclar/v263_heroic_hp_energy_test.py
          cp onarim/cikti_v263/ArenaForgePro_v3.60.263_HEROIC_ENERJI_KART_TEST.html app/src/main/assets/www/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/www/index.html').read_text('utf8')
          assert 'AFP263_HEROIC_ENERGY_BADGE_TEST' in s
          assert "const energyBadge=button.querySelector('.battleEnergyCost')" in s
          assert 'u.hp<u.maxHp-.01' in s and 'lossless:true' in s
          assert "powerPreference:'high-performance'" not in s and 'gl.scissor(0,glY,cw,bh)' not in s
          print('PASS: hero video energy badge, damage-only bars, dual-blade art; rejected GPU patch absent')
          PY
      - name: Build signed debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK contents and signature
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          p='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as f:
            s=f.read('assets/www/index.html').decode()
            assert 'AFP263_HEROIC_ENERGY_BADGE_TEST' in s
            assert 'if(energyBadge&&energyBadge.textContent!==String(cost))' in s
            assert 'u.hp<u.maxHp-.01' in s
            assert 'lossless:true' in s
            assert 'gl.scissor(0,glY,cw,bh)' not in s
          print('PASS: Android APK contains intended HTML')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaForgePro-v263-HEROIC-ENERJI-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
