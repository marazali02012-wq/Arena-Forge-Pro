plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.arenaforgepro.game'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.arenaforgepro.game'
        minSdk 24
        targetSdk 36
        versionCode 306
        versionName '3.60.306'
    }

    // Kurulu orijinal uygulamayla imza cakismasin diye yalnizca test APK'si
    // farkli paket adi kullanir. Release AAB'nin paket adi degismez.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        // Test APK: ayri paket adi -> kurulu oyun ve onceki .testfix test surumu silinmeden yan yana kurulur.
        debug {
            applicationIdSuffix '.v306test'
            versionNameSuffix '-v306-test'
            buildConfigField 'boolean', 'DIAG', 'false' // v303: şerit tanı katmanı kapalı; şerit düzeltmesi GameActivity'de kalıcı
        }
        release {
            buildConfigField 'boolean', 'DIAG', 'false'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
