plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.arenaforgepro.game'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.arenaforgepro.game'
        minSdk 24
        targetSdk 36
        versionCode 247
        versionName '3.60.247'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Play Billing (tek seferlik kozmetik ürünler); sunucu doğrulaması olmadan hak vermez.
    implementation 'com.android.billingclient:billing:7.1.1'
}
